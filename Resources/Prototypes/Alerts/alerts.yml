- type: alertOrder
  # Defines ordering in alert tab, higher up = higher in tab.
  # List below can contain alert type or category, if both are present the id will take precedence.
  # If item is not in list it will go at the bottom (ties broken by alert type enum value)
  id: BaseAlertOrder
  order:
    - category: Health
    - category: Stamina
    - alertType: SuitPower
    - category: Internals
    - alertType: Fire
    - alertType: Handcuffed
    - alertType: Ensnared
    - category: Buckled
    - alertType: Pulling
    - alertType: Walking
    - category: Piloting
    - alertType: Corporeal
    - alertType: Stun
    - category: Breathing # Vox gang not calling this oxygen
    - category: Pressure
    - alertType: Bleed
    - category: Temperature
    - category: Hunger
    - category: Thirst
    - alertType: Magboots
    - alertType: Rooted
    - alertType: Pacified
    - alertType: Stealthy

- type: entity
  id: AlertSpriteView
  categories: [ HideSpawnMenu ]
