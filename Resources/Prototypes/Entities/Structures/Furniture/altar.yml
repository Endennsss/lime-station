- type: entity
  abstract: true
  parent: [ BaseStructure, StructureHealthFurnitureStrong ]
  id: AltarBase
  name: altar
  description: Altar of the Gods.
  components:
  - type: Anchorable
  - type: Transform
  - type: Prayable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/demon_dies.ogg # Spooky!!
          params:
            volume: -4
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: #mouse can pass under, but I think this is can understandable by logic
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
    snapCardinals: true
  - type: Climbable
  - type: Clickable

- type: entity
  abstract: true
  parent: AltarBase
  id: AltarBaseWood
  components:
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 5
          MaterialCloth1:
            min: 1
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy

- type: entity
  abstract: true
  parent: AltarBase
  id: AltarBaseSteel
  components:
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 5
          MaterialCloth1:
            min: 1
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

